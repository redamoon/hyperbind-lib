name: Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance (--provenance) uses GitHub OIDC. 公開リポジトリでのみ有効。
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@hyperbind-lib'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # リポジトリの package.json を唯一の正とし、CI では書き換えずに検証だけ行う。
      # タグとバージョンがずれている場合はここで失敗させる（バージョンのドリフト防止）。
      - name: Verify package versions match tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            const pkgs = ['core', 'react', 'vue'];
            let failed = false;
            for (const name of pkgs) {
              const path = 'packages/' + name + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.version !== version) {
                console.error('✖ ' + path + ': version=' + pkg.version + ' but tag=v' + version);
                failed = true;
              } else {
                console.log('✔ ' + path + ': ' + pkg.version);
              }
            }
            if (failed) {
              console.error('');
              console.error('package.json のバージョンとタグが一致しません。');
              console.error('scripts/release.sh でバージョンを上げてコミットしてからタグを打ち直してください。');
              process.exit(1);
            }
          "

      # npm publish は workspace: プロトコルを解釈できないため、公開直前に実際の
      # バージョン範囲へ置き換える（この変更はリポジトリにはコミットしない）。
      - name: Resolve workspace dependencies for publish
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const name of ['react', 'vue']) {
              const path = 'packages/' + name + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (pkg.dependencies && pkg.dependencies['@hyperbind-lib/core']) {
                pkg.dependencies['@hyperbind-lib/core'] = '^' + version;
              }
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
              console.log('Resolved workspace dependency in ' + path);
            }
          "

      - name: Build @hyperbind-lib/core
        run: pnpm --filter @hyperbind-lib/core build

      - name: Build @hyperbind-lib/react
        run: pnpm --filter @hyperbind-lib/react build

      - name: Build @hyperbind-lib/vue
        run: pnpm --filter @hyperbind-lib/vue build

      - name: Publish @hyperbind-lib/core to npm
        working-directory: packages/core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hyperbind-lib/react to npm
        working-directory: packages/react
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hyperbind-lib/vue to npm
        working-directory: packages/vue
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
