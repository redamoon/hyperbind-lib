name: Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          registry-url: 'https://registry.npmjs.org'
          scope: '@hyperbind-lib'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update package.json versions
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          node -e "
            const fs = require('fs');
            
            // Update core package
            const corePkg = JSON.parse(fs.readFileSync('packages/core/package.json', 'utf8'));
            corePkg.version = '${{ steps.get_version.outputs.version }}';
            fs.writeFileSync('packages/core/package.json', JSON.stringify(corePkg, null, 2));
            
            // Update react package
            const reactPkg = JSON.parse(fs.readFileSync('packages/react/package.json', 'utf8'));
            reactPkg.version = '${{ steps.get_version.outputs.version }}';
            // Replace workspace dependency with actual version
            if (reactPkg.dependencies && reactPkg.dependencies['@hyperbind-lib/core']) {
              reactPkg.dependencies['@hyperbind-lib/core'] = '^${{ steps.get_version.outputs.version }}';
            }
            fs.writeFileSync('packages/react/package.json', JSON.stringify(reactPkg, null, 2));
            
            // Update vue package
            const vuePkg = JSON.parse(fs.readFileSync('packages/vue/package.json', 'utf8'));
            vuePkg.version = '${{ steps.get_version.outputs.version }}';
            // Replace workspace dependency with actual version
            if (vuePkg.dependencies && vuePkg.dependencies['@hyperbind-lib/core']) {
              vuePkg.dependencies['@hyperbind-lib/core'] = '^${{ steps.get_version.outputs.version }}';
            }
            fs.writeFileSync('packages/vue/package.json', JSON.stringify(vuePkg, null, 2));
            
            console.log('Updated all packages to version:', '${{ steps.get_version.outputs.version }}');
          "

      - name: Build @hyperbind-lib/core
        run: pnpm --filter @hyperbind-lib/core build

      - name: Build @hyperbind-lib/react
        run: pnpm --filter @hyperbind-lib/react build

      - name: Build @hyperbind-lib/vue
        run: pnpm --filter @hyperbind-lib/vue build

      - name: Publish @hyperbind-lib/core to npm
        working-directory: packages/core
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          echo "@hyperbind-lib:registry=https://registry.npmjs.org/" >> .npmrc
          npm whoami --registry=https://registry.npmjs.org/
          npm config set @hyperbind-lib:registry https://registry.npmjs.org/
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hyperbind-lib/react to npm
        working-directory: packages/react
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          echo "@hyperbind-lib:registry=https://registry.npmjs.org/" >> .npmrc
          npm whoami --registry=https://registry.npmjs.org/
          npm config set @hyperbind-lib:registry https://registry.npmjs.org/
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @hyperbind-lib/vue to npm
        working-directory: packages/vue
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          echo "@hyperbind-lib:registry=https://registry.npmjs.org/" >> .npmrc
          npm whoami --registry=https://registry.npmjs.org/
          npm config set @hyperbind-lib:registry https://registry.npmjs.org/
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

