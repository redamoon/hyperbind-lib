<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キーバインド設定 - HyperBind Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 0.5rem;
    }
    .section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .section h2 {
      margin-top: 0;
      color: #555;
    }
    .add-keybind {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .add-keybind:hover {
      background: #45a049;
    }
    .keybind-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .keybind-item {
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: #fff;
    }
    .keybind-item.disabled {
      background: #f5f5f5;
      opacity: 0.7;
    }
    .keybind-item.warning {
      border: 2px solid #ff9800;
    }
    .keybind-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .keybind-item input[type="checkbox"] {
      cursor: pointer;
    }
    .keybind-item input[type="text"] {
      flex: 1;
      padding: 0.25rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .key-input {
      width: 200px;
      padding: 0.25rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
      background: #f9f9f9;
    }
    .key-input.recording {
      background: #fff3cd;
      border-color: #ff9800;
    }
    .btn-delete {
      padding: 0.25rem 0.5rem;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.85rem;
    }
    .warning-message {
      padding: 0.5rem;
      background: #fff3cd;
      border: 1px solid #ff9800;
      border-radius: 3px;
      font-size: 0.85rem;
      color: #856404;
    }
    .empty-state {
      color: #999;
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem;
    }
    .info-box {
      background: #e3f2fd;
      border: 1px solid #2196F3;
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .info-box h3 {
      margin: 0 0 0.5rem 0;
      color: #1976d2;
    }
    .reserved-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .key-badge {
      background: #333;
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>⚙️ キーバインド設定</h1>

  <div class="info-box">
    <h3>ℹ️ 使い方</h3>
    <p style="margin: 0.5rem 0;">
      キーバインドを追加して、カスタムショートカットを登録できます。<br>
      キーの入力欄をクリックして、使いたいキーを押してください。
    </p>
    <details style="margin-top: 0.5rem;">
      <summary style="cursor: pointer; color: #1976d2;">予約されたキーを表示</summary>
      <div class="reserved-keys" id="reservedKeys"></div>
    </details>
  </div>

  <div class="section">
    <h2>カスタムキーバインド</h2>
    <button class="add-keybind" onclick="addKeybind()">➕ キーバインドを追加</button>
    <div class="keybind-list" id="keybindList"></div>
  </div>

  <script type="module">
    // 予約されたキーのリスト
    const RESERVED_KEYS = [
      "f5", "ctrl+r", "cmd+r", "ctrl+shift+r", "cmd+shift+r", "ctrl+f5",
      "ctrl+t", "cmd+t", "ctrl+w", "cmd+w", "ctrl+shift+t", "cmd+shift+t",
      "ctrl+l", "cmd+l", "ctrl+s", "cmd+s", "ctrl+n", "cmd+n", "ctrl+shift+n",
      "cmd+shift+n", "f11", "escape", "ctrl+f", "cmd+f", "ctrl+g", "cmd+g", "f3",
      "ctrl+h", "cmd+h", "ctrl+j", "cmd+j", "ctrl+shift+d", "f12", "ctrl+shift+i",
      "cmd+option+i", "ctrl+shift+j", "cmd+option+j", "ctrl+p", "cmd+p",
      "ctrl+a", "cmd+a", "ctrl+c", "cmd+c", "ctrl+v", "cmd+v", "ctrl+x", "cmd+x",
      "ctrl+z", "cmd+z", "ctrl+y", "cmd+shift+z",
    ];

    // ローカルストレージから読み込み
    let keybinds = [];
    const STORAGE_KEY = "hyperbind_custom_keybinds";

    function loadKeybinds() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        keybinds = JSON.parse(saved);
      }
      renderKeybinds();
    }

    function saveKeybinds() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(keybinds));
    }

    function isReservedKey(keyCombo) {
      const normalized = keyCombo.toLowerCase().trim();
      return RESERVED_KEYS.includes(normalized);
    }

    function getReservedKeyWarning(keyCombo) {
      if (isReservedKey(keyCombo)) {
        return "⚠️ このキーは一般的にブラウザやアプリケーションで使用されています（例: 保存、リロード、コピーなど）。使用する場合は注意してください。";
      }
      return null;
    }

    function addKeybind() {
      const newKeybind = {
        id: Date.now().toString(),
        label: "新しいアクション",
        keyCombo: "ctrl+k",
        enabled: true,
        preventDefault: true,
      };
      keybinds.push(newKeybind);
      saveKeybinds();
      renderKeybinds();
    }

    function removeKeybind(id) {
      keybinds = keybinds.filter(kb => kb.id !== id);
      saveKeybinds();
      renderKeybinds();
    }

    function updateKeybind(id, updates) {
      keybinds = keybinds.map(kb => {
        if (kb.id === id) {
          return { ...kb, ...updates };
        }
        return kb;
      });
      saveKeybinds();
      renderKeybinds();
    }

    function toggleKeybind(id) {
      keybinds = keybinds.map(kb => {
        if (kb.id === id) {
          return { ...kb, enabled: !kb.enabled };
        }
        return kb;
      });
      saveKeybinds();
      renderKeybinds();
    }

    function togglePreventDefault(id) {
      keybinds = keybinds.map(kb => {
        if (kb.id === id) {
          return { ...kb, preventDefault: !kb.preventDefault };
        }
        return kb;
      });
      saveKeybinds();
      renderKeybinds();
    }

    function renderKeybinds() {
      const container = document.getElementById('keybindList');
      
      if (keybinds.length === 0) {
        container.innerHTML = '<div class="empty-state">キーバインドが登録されていません</div>';
        return;
      }

      container.innerHTML = '';
      
      keybinds.forEach(kb => {
        const warning = getReservedKeyWarning(kb.keyCombo);
        const item = document.createElement('div');
        item.className = 'keybind-item';
        if (!kb.enabled) item.classList.add('disabled');
        if (warning) item.classList.add('warning');

        const row = document.createElement('div');
        row.className = 'keybind-row';

        // 有効/無効チェックボックス
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = kb.enabled;
        checkbox.title = '有効/無効';
        checkbox.addEventListener('change', () => toggleKeybind(kb.id));

        // ラベル入力
        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.value = kb.label;
        labelInput.placeholder = 'ラベル';
        labelInput.addEventListener('change', (e) => {
          updateKeybind(kb.id, { label: e.target.value });
        });

        // キー入力
        const keyInput = document.createElement('input');
        keyInput.type = 'text';
        keyInput.className = 'key-input';
        keyInput.value = kb.keyCombo;
        keyInput.readOnly = true;
        keyInput.placeholder = '押してください...';
        
        let isRecording = false;
        keyInput.addEventListener('focus', () => {
          isRecording = true;
          keyInput.classList.add('recording');
          keyInput.value = '押してください...';
        });

        keyInput.addEventListener('keydown', (e) => {
          if (!isRecording) return;
          e.preventDefault();
          e.stopPropagation();

          const parts = [];
          if (e.metaKey) parts.push('cmd');
          if (e.ctrlKey) parts.push('ctrl');
          if (e.shiftKey) parts.push('shift');
          if (e.altKey) parts.push('alt');
          parts.push(e.key.toLowerCase());
          
          const newKey = parts.join('+');
          updateKeybind(kb.id, { keyCombo: newKey });
          
          isRecording = false;
          keyInput.classList.remove('recording');
          keyInput.blur();
        });

        keyInput.addEventListener('blur', () => {
          if (isRecording) {
            isRecording = false;
            keyInput.classList.remove('recording');
            keyInput.value = kb.keyCombo;
          }
        });

        // preventDefault チェックボックス
        const preventDefaultLabel = document.createElement('label');
        preventDefaultLabel.className = 'checkbox-label';
        const preventDefaultCheckbox = document.createElement('input');
        preventDefaultCheckbox.type = 'checkbox';
        preventDefaultCheckbox.checked = kb.preventDefault;
        preventDefaultCheckbox.title = 'ブラウザのデフォルト動作を防止';
        preventDefaultCheckbox.addEventListener('change', () => togglePreventDefault(kb.id));
        preventDefaultLabel.appendChild(preventDefaultCheckbox);
        preventDefaultLabel.appendChild(document.createTextNode('preventDefault'));

        // 削除ボタン
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'btn-delete';
        deleteBtn.textContent = '削除';
        deleteBtn.addEventListener('click', () => removeKeybind(kb.id));

        row.appendChild(checkbox);
        row.appendChild(labelInput);
        row.appendChild(keyInput);
        row.appendChild(preventDefaultLabel);
        row.appendChild(deleteBtn);

        item.appendChild(row);

        // 警告メッセージ
        if (warning) {
          const warningDiv = document.createElement('div');
          warningDiv.className = 'warning-message';
          warningDiv.textContent = warning;
          item.appendChild(warningDiv);
        }

        container.appendChild(item);
      });
    }

    // 予約されたキーを表示
    function renderReservedKeys() {
      const container = document.getElementById('reservedKeys');
      container.innerHTML = '';
      
      RESERVED_KEYS.forEach(key => {
        const badge = document.createElement('span');
        badge.className = 'key-badge';
        badge.textContent = key;
        container.appendChild(badge);
      });
    }

    // キーバインドを実際に登録して動作させる
    function registerKeybinds() {
      window.addEventListener('keydown', (e) => {
        const parts = [];
        if (e.metaKey) parts.push('cmd');
        if (e.ctrlKey) parts.push('ctrl');
        if (e.shiftKey) parts.push('shift');
        if (e.altKey) parts.push('alt');
        parts.push(e.key.toLowerCase());
        const combo = parts.join('+');

        keybinds.forEach(kb => {
          if (!kb.enabled) return;
          
          const normalizedCombo = kb.keyCombo.toLowerCase();
          let matches = combo === normalizedCombo;

          // クロスプラットフォーム対応
          if (!matches && e.metaKey && normalizedCombo.includes('ctrl')) {
            matches = combo === normalizedCombo.replace('ctrl', 'cmd');
          } else if (!matches && e.ctrlKey && normalizedCombo.includes('cmd')) {
            matches = combo === normalizedCombo.replace('cmd', 'ctrl');
          }

          if (matches) {
            if (kb.preventDefault) {
              e.preventDefault();
            }
            alert(`🎯 ${kb.label} が実行されました！`);
          }
        });
      });
    }

    // 初期化
    loadKeybinds();
    renderReservedKeys();
    registerKeybinds();
  </script>
</body>
</html>
