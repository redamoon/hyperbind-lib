<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受注伝票入力画面 - HyperBind Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 0.5rem;
    }
    .section {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .section h2 {
      margin-top: 0;
      color: #555;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    input {
      padding: 0.5rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .input-hint {
      margin-left: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
    .customer-info {
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 4px;
      margin-top: 1rem;
    }
    .input-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .input-row > div {
      flex: 1;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 1rem;
    }
    .btn-clear {
      background: #f44336;
      color: white;
    }
    .btn-register {
      background: #4CAF50;
      color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      padding: 0.5rem;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
    tfoot td {
      font-weight: bold;
    }
    .shortcuts {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 2rem;
    }
    .shortcuts h3 {
      margin-top: 0;
      color: #333;
    }
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }
    .key {
      display: inline-block;
      background: #333;
      color: white;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📋 受注伝票入力画面</h1>

  <div class="section">
    <h2>取引先情報</h2>
    <div>
      <label>
        取引先コード:
        <input type="text" id="customerCode" placeholder="例: C001" />
        <span class="input-hint">⌘+Enter: 検索</span>
      </label>
    </div>
    <div id="customerInfo" class="customer-info" style="display: none;">
      <div><strong>会社名:</strong> <span id="customerName"></span></div>
      <div><strong>住所:</strong> <span id="customerAddress"></span></div>
    </div>
  </div>

  <div class="section">
    <h2>受注明細入力</h2>
    <div class="input-row">
      <div>
        <label>
          商品コード:
          <input type="text" id="productCode" placeholder="例: P001" />
        </label>
      </div>
      <div>
        <label>
          数量:
          <input type="number" id="quantity" value="1" min="1" />
        </label>
      </div>
    </div>
    <p style="font-size: 0.9rem; color: #666;">
      商品コード入力 → Enter: 数量に移動 | 数量入力 → Enter: 明細に追加
    </p>

    <div id="orderItems" style="margin-top: 2rem;"></div>
  </div>

  <div>
    <button class="btn-clear" onclick="handleNew()">クリア (F2)</button>
    <button class="btn-register" onclick="handleRegister()">登録 (F12)</button>
  </div>

  <div class="shortcuts">
    <h3>📋 キーボードショートカット</h3>
    <div class="shortcuts-grid">
      <div><span class="key">F2</span>: 新規作成</div>
      <div><span class="key">F8</span>: 参照</div>
      <div><span class="key">F9</span>: 削除</div>
      <div><span class="key">F12</span>: 登録</div>
      <div><span class="key">⌘+Enter</span>: 取引先検索</div>
      <div><span class="key">Enter</span>: 次の入力へ</div>
      <div><span class="key">Tab</span>: 次の項目へ</div>
    </div>
  </div>

  <script type="module">
    // データ
    const CUSTOMERS = [
      { code: "C001", name: "株式会社ABC", address: "東京都千代田区1-1-1" },
      { code: "C002", name: "株式会社XYZ", address: "大阪府大阪市2-2-2" },
      { code: "C003", name: "株式会社DEF", address: "福岡県福岡市3-3-3" },
    ];

    const PRODUCTS = [
      { code: "P001", name: "ノートPC", price: 98000 },
      { code: "P002", name: "マウス", price: 2500 },
      { code: "P003", name: "キーボード", price: 5800 },
      { code: "P004", name: "モニター", price: 28000 },
    ];

    let currentCustomer = null;
    let orderItems = [];
    let currentProductCode = "";
    let currentQuantity = "1";

    // DOM要素の取得
    const customerCodeInput = document.getElementById('customerCode');
    const productCodeInput = document.getElementById('productCode');
    const quantityInput = document.getElementById('quantity');
    const customerInfo = document.getElementById('customerInfo');
    const customerName = document.getElementById('customerName');
    const customerAddress = document.getElementById('customerAddress');
    const orderItemsContainer = document.getElementById('orderItems');

    // 取引先コード検索
    function searchCustomer() {
      const code = customerCodeInput.value;
      const found = CUSTOMERS.find(c => c.code === code);
      if (found) {
        currentCustomer = found;
        customerInfo.style.display = 'block';
        customerName.textContent = found.name;
        customerAddress.textContent = found.address;
      } else {
        alert("取引先が見つかりません");
        currentCustomer = null;
        customerInfo.style.display = 'none';
      }
    }

    // 商品コード検索
    function searchProduct() {
      const code = productCodeInput.value;
      const found = PRODUCTS.find(p => p.code === code);
      if (found) {
        currentProductCode = code;
        quantityInput.focus();
      } else {
        alert("商品が見つかりません");
      }
    }

    // 明細に追加
    function addOrderItem() {
      const code = productCodeInput.value;
      const found = PRODUCTS.find(p => p.code === code);
      const qty = parseInt(quantityInput.value) || 1;
      
      if (found) {
        const item = {
          product: found,
          quantity: qty,
          amount: found.price * qty,
        };
        orderItems.push(item);
        
        productCodeInput.value = "";
        quantityInput.value = "1";
        currentProductCode = "";
        currentQuantity = "1";
        productCodeInput.focus();
        renderOrderItems();
      }
    }

    // 明細一覧を描画
    function renderOrderItems() {
      if (orderItems.length === 0) {
        orderItemsContainer.innerHTML = "";
        return;
      }

      const totalAmount = orderItems.reduce((sum, item) => sum + item.amount, 0);

      let html = `
        <h3>受注明細一覧</h3>
        <table>
          <thead>
            <tr>
              <th>商品コード</th>
              <th>商品名</th>
              <th style="text-align: right;">単価</th>
              <th style="text-align: right;">数量</th>
              <th style="text-align: right;">金額</th>
            </tr>
          </thead>
          <tbody>
      `;

      orderItems.forEach(item => {
        html += `
          <tr>
            <td>${item.product.code}</td>
            <td>${item.product.name}</td>
            <td style="text-align: right;">¥${item.product.price.toLocaleString()}</td>
            <td style="text-align: right;">${item.quantity}</td>
            <td style="text-align: right;">¥${item.amount.toLocaleString()}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
          <tfoot>
            <tr style="background: #f0f0f0;">
              <td colspan="4" style="text-align: right;">合計金額:</td>
              <td style="text-align: right;">¥${totalAmount.toLocaleString()}</td>
            </tr>
          </tfoot>
        </table>
      `;

      orderItemsContainer.innerHTML = html;
    }

    // F2: 新規作成
    function handleNew() {
      customerCodeInput.value = "";
      currentCustomer = null;
      customerInfo.style.display = 'none';
      orderItems = [];
      productCodeInput.value = "";
      quantityInput.value = "1";
      renderOrderItems();
      customerCodeInput.focus();
    }

    // F9: 削除
    function handleDelete() {
      if (orderItems.length > 0) {
        orderItems.pop();
        renderOrderItems();
      }
    }

    // F12: 登録
    function handleRegister() {
      if (!currentCustomer) {
        alert("取引先を選択してください");
        return;
      }
      if (orderItems.length === 0) {
        alert("受注明細を追加してください");
        return;
      }
      const total = orderItems.reduce((sum, item) => sum + item.amount, 0);
      alert(`受注伝票を登録しました！\n取引先: ${currentCustomer.name}\n合計金額: ¥${total.toLocaleString()}`);
    }

    // キーボードイベントの処理
    customerCodeInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        searchCustomer();
      }
    });

    productCodeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchProduct();
      }
    });

    quantityInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addOrderItem();
      }
    });

    // グローバルキーバインド
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F2') {
        e.preventDefault();
        handleNew();
      } else if (e.key === 'F9') {
        e.preventDefault();
        handleDelete();
      } else if (e.key === 'F12') {
        e.preventDefault();
        handleRegister();
      } else if (e.key === 'F8') {
        e.preventDefault();
        const active = document.activeElement;
        if (active === customerCodeInput) {
          alert(`取引先一覧:\n${CUSTOMERS.map(c => `${c.code}: ${c.name}`).join("\n")}`);
        } else if (active === productCodeInput) {
          alert(`商品一覧:\n${PRODUCTS.map(p => `${p.code}: ${p.name} (¥${p.price.toLocaleString()})`).join("\n")}`);
        }
      }
    });

    // フォームナビゲーション
    const inputs = [customerCodeInput, productCodeInput, quantityInput];
    inputs.forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.shiftKey) {
          e.preventDefault();
          const currentIndex = inputs.indexOf(e.target);
          const nextIndex = (currentIndex + 1) % inputs.length;
          inputs[nextIndex].focus();
        } else if (e.key === 'Tab' && e.shiftKey) {
          e.preventDefault();
          const currentIndex = inputs.indexOf(e.target);
          const prevIndex = (currentIndex - 1 + inputs.length) % inputs.length;
          inputs[prevIndex].focus();
        }
      });
    });

    // 初期フォーカス
    customerCodeInput.focus();
  </script>
</body>
</html>
