<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperBind Core - Vanilla JS Example</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #4CAF50;
      padding-bottom: 0.5rem;
    }
    h2 {
      color: #555;
      margin-top: 0;
    }
    .keybind-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .keybind-item {
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1rem;
      background: #fafafa;
    }
    .keybind-item h3 {
      margin: 0 0 0.5rem 0;
      color: #4CAF50;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .keybind-combo {
      display: inline-block;
      background: #333;
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      font-family: monospace;
      font-weight: bold;
    }
    .keybind-desc {
      color: #666;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }
    .category-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .category-ledger { background: #e3f2fd; color: #1976d2; }
    .category-invoice { background: #f3e5f5; color: #7b1fa2; }
    .category-report { background: #e8f5e9; color: #388e3c; }
    .category-general { background: #fff3e0; color: #f57c00; }
    .demo-section {
      margin-top: 2rem;
      padding: 1rem;
      border: 2px dashed #ddd;
      border-radius: 4px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem;
    }
    button:hover {
      background: #45a049;
    }
    .log {
      background: #000;
      color: #0f0;
      padding: 1rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9rem;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎹 HyperBind Core - プリセットキーバインド使用例</h1>
    <p>この例では、コアパッケージのプリセットキーバインドをブラウザのpure JavaScriptで使用しています。</p>
    
    <div class="demo-section">
      <h2>デモ: キーバインドを試す</h2>
      <p>以下のキーを押してください（このページにフォーカスがある状態で）:</p>
      <ul>
        <li><strong>F2:</strong> 伝票を新規作成</li>
        <li><strong>F8:</strong> 参照</li>
        <li><strong>F9:</strong> 削除</li>
        <li><strong>F12:</strong> 登録</li>
        <li><strong>Ctrl+F:</strong> 検索</li>
        <li><strong>Ctrl+Insert:</strong> 行挿入</li>
        <li><strong>Ctrl+Delete:</strong> 行削除</li>
      </ul>
      <div class="log" id="log">
        &gt; キーバインドを待機中...<br>
      </div>
    </div>
  </div>

  <div class="container">
    <h2>📋 利用可能なプリセットキーバインド</h2>
    
    <div id="keybinds-container"></div>
  </div>

  <script type="module">
    // Note: 実際の使用時は、ビルド済みのパッケージをインポートしてください
    // import { binder, INVOICE_KEYBINDS, GENERAL_KEYBINDS } from '@hyperbind/core';
    
    // このデモでは、プリセットキーバインドの構造を示すために静的データを使用
    const INVOICE_KEYBINDS = [
      { id: 'invoice-new', keyCombo: 'f2', label: '新規作成', category: 'invoice', description: '伝票に表示されている内容をクリアし、新規に伝票を登録できるようにします。', preventDefault: true },
      { id: 'invoice-reference', keyCombo: 'f8', label: '参照', category: 'invoice', description: '参照画面が表示されます。', preventDefault: true },
      { id: 'invoice-delete', keyCombo: 'f9', label: '削除', category: 'invoice', description: '表示中の伝票を削除します。', preventDefault: true },
      { id: 'invoice-register', keyCombo: 'f12', label: '登録', category: 'invoice', description: '新規作成/修正した伝票を登録します。', preventDefault: true },
      { id: 'invoice-search', keyCombo: 'ctrl+f', label: '検索', category: 'invoice', description: '検索画面が表示されます。', preventDefault: true },
      { id: 'invoice-insert-row', keyCombo: 'ctrl+insert', label: '行挿入', category: 'invoice', description: '選択した行の前に新しい行が挿入されます。', preventDefault: true },
      { id: 'invoice-delete-row', keyCombo: 'ctrl+delete', label: '行削除', category: 'invoice', description: '選択した行を削除します。', preventDefault: true },
    ];

    const GENERAL_KEYBINDS = [
      { id: 'general-help', keyCombo: 'f1', label: 'ヘルプ', category: 'general', description: '現在、表示している画面に関する製品サポートページが表示されます。', preventDefault: true },
      { id: 'general-print', keyCombo: 'ctrl+p', label: '印刷', category: 'general', description: '印刷画面が表示されます。', preventDefault: false },
    ];

    // シンプルなキーバインドマネージャーの実装（デモ用）
    const keybindManager = {
      bindings: new Map(),
      
      register(keyCombo, callback, options = {}) {
        const normalized = keyCombo.toLowerCase();
        this.bindings.set(normalized, { callback, preventDefault: options.preventDefault !== false });
      },
      
      handleKey(event) {
        const parts = [];
        if (event.metaKey) parts.push('cmd');
        if (event.ctrlKey) parts.push('ctrl');
        if (event.shiftKey) parts.push('shift');
        if (event.altKey) parts.push('alt');
        parts.push(event.key.toLowerCase());
        const combo = parts.join('+');
        
        const binding = this.bindings.get(combo);
        if (binding) {
          if (binding.preventDefault) {
            event.preventDefault();
          }
          binding.callback();
          return true;
        }
        return false;
      }
    };

    // プリセットキーバインドを登録
    const logElement = document.getElementById('log');
    
    function log(message) {
      const time = new Date().toLocaleTimeString();
      logElement.innerHTML += `&gt; [${time}] ${message}<br>`;
      logElement.scrollTop = logElement.scrollHeight;
    }

    [...INVOICE_KEYBINDS, ...GENERAL_KEYBINDS].forEach(preset => {
      keybindManager.register(preset.keyCombo, () => {
        log(`🎯 ${preset.label} (${preset.keyCombo})`);
      }, { preventDefault: preset.preventDefault });
    });

    // グローバルキーイベントをリッスン
    window.addEventListener('keydown', (e) => {
      keybindManager.handleKey(e);
    });

    log('✅ プリセットキーバインドが登録されました');

    // プリセットキーバインドのリストを表示
    const container = document.getElementById('keybinds-container');
    const allKeybinds = [...INVOICE_KEYBINDS, ...GENERAL_KEYBINDS];
    
    const grouped = allKeybinds.reduce((acc, kb) => {
      if (!acc[kb.category]) acc[kb.category] = [];
      acc[kb.category].push(kb);
      return acc;
    }, {});

    Object.entries(grouped).forEach(([category, keybinds]) => {
      const categoryDiv = document.createElement('div');
      categoryDiv.className = 'keybind-list';
      
      keybinds.forEach(kb => {
        const item = document.createElement('div');
        item.className = 'keybind-item';
        
        const categoryNames = {
          invoice: '伝票',
          general: '全般',
          ledger: '台帳',
          report: 'レポート'
        };

        item.innerHTML = `
          <h3>
            <span class="category-badge category-${kb.category}">${categoryNames[kb.category] || kb.category}</span>
            ${kb.label}
            <span class="keybind-combo">${kb.keyCombo}</span>
          </h3>
          <div class="keybind-desc">${kb.description}</div>
        `;
        
        categoryDiv.appendChild(item);
      });
      
      container.appendChild(categoryDiv);
    });
  </script>
</body>
</html>
